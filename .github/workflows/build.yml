name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # publish releases on version tags

jobs:
  mac-app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Versions
        run: |
          sw_vers
          swift --version
      - name: Core tests on macOS
        run: swift test
        working-directory: SubsCore
      - name: Build, bundle and sign
        env:
          SIGN_P12_BASE64: ${{ secrets.SIGN_P12_BASE64 }}
          SIGN_P12_PASSWORD: ${{ secrets.SIGN_P12_PASSWORD }}
        run: |
          VERSION="0.1.${{ github.run_number }}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF#refs/tags/v}"; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          scripts/bundle-app.sh "$VERSION" "${{ github.run_number }}"
      - uses: actions/upload-artifact@v4
        with:
          name: LiveSubs-${{ env.VERSION }}
          path: dist/LiveSubs-${{ env.VERSION }}.zip
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "dist/LiveSubs-$VERSION.zip" --title "LiveSubs $VERSION" --notes "Download LiveSubs-$VERSION.zip, unzip, and move LiveSubs to Applications."
